[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xgpedia"
version = "0.80.3"
description = "XGPedia — خط تولید محتوای تحلیلی فوتبال داده‌محور (عدد را API می‌دهد، متن را مدل می‌نویسد، تصویر را قالب HTML می‌سازد)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",           # کلاینت HTTP با timeout/retry برای providerها
    "pydantic>=2.7",         # schema داخلی و validation ساختار
    "python-dotenv>=1.0",    # بارگذاری .env
]

[project.optional-dependencies]
# مرحلهٔ رندر: playwright + jdatetime + pillow — نصب: pip install -e ".[render]"
render = [
    "playwright>=1.47",      # رندر HTML به PNG/JPEG و ضبط فریم ویدیو
    "jdatetime>=5.0",        # تاریخ جلالی در کارت (نمایش فارسی، ذخیره همیشه UTC)
    "pillow>=10.0",          # تبدیل JPEG اینستاگرام در omnichannel و پیکسل‌چک تست‌های رندر
]
# مرحلهٔ انتشار: تلگرام و RSS
publish = [
    "aiogram>=3.13",         # ربات تلگرام (approval/publish)
    "feedparser>=6.0",       # RSS اخبار رسمی (Workflow F)
]
# اسکریپینگ و منابع کمکی اختیاری (FotMob/IRIB)
scrape = [
    "curl_cffi>=0.7",        # پشتیبان اختیاری درخواست‌های TLS مرورگری
    "beautifulsoup4>=4.12",  # پارس HTML کنداکتور IRIB
]
# انتشار مستقیم اینستاگرام (اختیاری)
instagram = [
    "instagrapi>=2.1",       # آپلود مستقیم عکس و ریلز با IG_SESSIONID
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
