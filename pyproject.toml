[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xgpedia"
version = "0.30.3"
description = "XGPedia — خط تولید محتوای تحلیلی فوتبال داده‌محور (عدد را API می‌دهد، متن را مدل می‌نویسد، تصویر را قالب HTML می‌سازد)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",           # کلاینت HTTP با timeout/retry برای providerها
    "pydantic>=2.7",         # schema داخلی و validation ساختار
    "python-dotenv>=1.0",    # بارگذاری .env
]

[project.optional-dependencies]
# مرحلهٔ رندر (هفتهٔ ۵): jinja2 + playwright + jdatetime + pillow — نصب: pip install -e ".[render]"
render = [
    "jinja2>=3.1",           # پرکردن قالب‌های کارت از draft/fact JSON
    "playwright>=1.47",      # رندر HTML به PNG/JPEG و ضبط فریم ویدیو
    "jdatetime>=5.0",        # تاریخ جلالی در کارت (نمایش فارسی، ذخیره همیشه UTC)
    "pillow>=10.0",          # پیکسل‌چک تست‌های رندر (ابعاد/غیرخالی بودن) — کد src به آن نیاز ندارد
]
# مرحلهٔ انتشار (هفتهٔ ۹+): تلگرام و RSS
publish = [
    "aiogram>=3.13",         # ربات تلگرام (approval/publish)
    "feedparser>=6.0",       # RSS اخبار رسمی (Workflow F)
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "gitleaks>=8.18",        # اسکن secret در pre-commit (پیشنهاد نسخهٔ ۲)
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
