[project]
name = "xgpedia"
version = "0.1.0"
description = "XGPedia — خط تولید محتوای تحلیلی فوتبال داده‌محور (عدد را API می‌دهد، متن را مدل می‌نویسد، تصویر را قالب HTML می‌سازد)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",           # کلاینت HTTP با timeout/retry برای providerها
    "pydantic>=2.7",         # schema داخلی و validation ساختار
    "python-dotenv>=1.0",    # بارگذاری .env
    "jinja2>=3.1",           # پرکردن قالب‌های کارت از match.json
    "playwright>=1.47",      # رندر HTML به PNG/JPEG و ضبط فریم ویدیو
    "aiogram>=3.13",         # ربات تلگرام (approval/publish)
    "feedparser>=6.0",       # RSS اخبار رسمی (Workflow F)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "gitleaks>=8.18",        # اسکن secret در pre-commit (پیشنهاد نسخهٔ ۲)
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
