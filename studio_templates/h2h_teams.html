// 240-deg orbital dominance chronograph SVG
function chronoSVG(hw,dr,aw,hc,ac){
const tot=Math.max(1,hw+dr+aw),cx=160,cy=148,R=108,Rt=126,s0=-30,e0=210,sp=240,g=5.5,u=sp-g*2,aH=hw/tot*u,aD=dr/tot*u;

return`<svg viewBox="0 0 320 248" class="hero-gauge-svg w-full max-w-[300px] h-auto overflow-visible" fill="none"><defs><filter id="cgGlow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="${cx}" cy="${cy}" r="88" fill="#060D1E" fill-opacity=".75" stroke="#ffffff14" stroke-width="1.5"/><circle cx="${cx}" cy="${cy}" r="78" stroke="#E62E45" stroke-opacity=".22" stroke-dasharray="3 5"/>${tk}<path d="${arc(s0,e0,R)}" stroke="#ffffff14" stroke-width="18" stroke-linecap="round"/><path d="${arc(s1,e1,R)}" stroke="${hc}" stroke-width="18" stroke-linecap="round" filter="url(#cgGlow)"/><path d="${arc(s2,e2,R)}" stroke="#94A3B8" stroke-width="15" stroke-linecap="round"/><path d="${arc(s3,e0,R)}" stroke="${ac}" stroke-width="18" stroke-linecap="round" filter="url(#cgGlow)"/><text x="${cx}" y="${cy+6}" text-anchor="middle" fill="#fff" font-family="Vazirmatn" font-weight="900" font-size="54">${fa(tot)}</text><text x="${cx}" y="${cy+34}" text-anchor="middle" fill="#CBD5E1" font-family="Vazirmatn" font-weight="800" font-size="17">مجموع تقابل‌ها</text><g transform="translate(${cx},216)"><line x1="-68" y1="0" x2="-34" y2="0" stroke="#E62E45" stroke-opacity=".55" stroke-width="1.8"/><line x1="34" y1="0" x2="68" y2="0" stroke="#E62E45" stroke-opacity=".55" stroke-width="1.8"/><rect x="-26" y="-26" width="52" height="52" rx="12" transform="rotate(45)" fill="#E62E45" stroke="#ffffff55" stroke-width="2" filter="url(#cgGlow)"/><text x="0" y="7" text-anchor="middle" fill="#fff" font-family="Space Grotesk" font-weight="800" font-size="21" letter-spacing="1">H2H</text></g></svg>`;
}

function modUI(){
const host=$('mcl');
host.innerHTML=S.mods.map((m,i)=>{const[,t,h]=MD[i];return`<div class="fbw gap-2 p-2.5 min-h-[44px] lg:min-h-[38px] rounded-xl bg-[#091124] border ${m.e?'border-white/20':'border-white/5 opacity-65'} transition"><label class="fi gap-2.5 min-w-0 flex-1 cursor-pointer"><input type="checkbox" data-m="${m.id}" ${m.e?'checked':''} class="mc accent-[#E62E45] w-4 h-4 cursor-pointer shrink-0"><span class="text-xs font-bold text-slate-100 truncate">${t}</span></label>${h?`<div class="fi bg-[#040814] rounded-lg p-0.5 border border-white/10 shrink-0"><button data-m="${m.id}" data-w="half" class="spn px-2 py-1 rounded text-[10px] font-bold ${m.s==='half'?'bg-[#E62E45] text-white':'text-slate-400'}">½</button><button data-m="${m.id}" data-w="full" class="spn px-2 py-1 rounded text-[10px] font-bold ${m.s==='full'?'bg-[#E62E45] text-white':'text-slate-400'}">۱</button></div>`:'<span class="text-[10px] text-slate-500 px-1.5 shrink-0">تمام‌عرض</span>'}</div>`}).join('');
host.querySelectorAll('.mc').forEach(c=>c.onchange=()=>{const t=S.mods.find(x=>x.id===c.dataset.m);if(!c.checked&&S.mods.filter(x=>x.e).length<=1){c.checked=true;return T('حداقل یک ماژول باید فعال بماند')}t.e=c.checked;S.sp='custom';hl();modUI();draw()});
host.querySelectorAll('.spn').forEach(b=>b.onclick=()=>{const t=S.mods.find(x=>x.id===b.dataset.m);if(!t)return;t.s=b.dataset.w;t.e=true;S.sp='custom';hl();modUI();draw()});
}

// Dynamic live editor builder & two-way path binder
const getP=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);
const setP=(o,p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v};
const teamFlds=(pfx,path)=>[
  [`ed-${pfx}n`,'نام تیم',`${path}.name`,'text'],[`ed-${pfx}cd`,'کد ۳ حرفی',`${path}.code`,'code'],
  [`ed-${pfx}s`,'زیرنویس / سرمربی',`${path}.sub`,'text',1],[`ed-${pfx}logo`,'آدرس لوگوی اختصاصی (اختیاری URL)',`${path}.logoUrl`,'url',1],
  [`ed-${pfx}w`,'تعداد برد',`${path}.wins`,'num'],[`ed-${pfx}g`,'مجموع گل زده',`${path}.goals`,'num'],
  [`ed-${pfx}cs`,'کلین‌شیت',`${path}.cleanSheets`,'num'],[`ed-${pfx}kn`,'برترین گلزن (نام)',`${path}.king.name`,'text'],
  [`ed-${pfx}kg`,'گل‌های آقای‌گل',`${path}.king.goals`,'num'],[`ed-${pfx}st`,'نشان روند',`${path}.streak`,'text']
];
const ED_META=[['ed-comp','نام رقابت','competition','text'],['ed-round','عنوان / بازه تقابل','round','text'],['ed-era','توضیح تاریخچه','eraNote','text'],['ed-src','منبع داده','source','text']];
const ED_ALL=[...ED_META,['ed-hc','','home.color','color'],...teamFlds('h','home'),['ed-dr','','draws','num'],['ed-ac','','away.color','color'],...teamFlds('a','away'),['ed-dt','تیتر تحلیلی','dna.headline','text'],['ed-db','متن حکم تحریریه','dna.body','area']];

function buildEditor(){
const fld=([id,lb,,tp,sp])=>`<div${sp?' class="col-span-2"':''}><label class="lbl">${lb}</label>${tp==='area'?`<textarea id="${id}" rows="3" class="inp resize-none leading-relaxed"></textarea>`:`<input id="${id}" class="inp${tp==='code'?' fm uppercase':tp==='num'?' fm':tp==='url'?' fm text-[11px]':''}" type="${tp==='num'?'number':tp==='url'?'url':'text'}"${tp==='num'?' min="0"':''}${tp==='code'?' maxlength="3"':''}${tp==='url'?' dir="ltr" placeholder="https://..."':''}>`}</div>`;
const tCard=(tt,cid,flds)=>`<div class="bg-[#040814] border border-white/10 rounded-2xl p-3.5 space-y-3"><div class="fbw border-b border-white/10 pb-2"><span class="text-xs font-black text-white">${tt}</span><input id="${cid}" type="color" class="w-7 h-6 rounded bg-transparent border-0 cursor-pointer"></div><div class="grid grid-cols-2 gap-2.5">${flds.map(fld).join('')}</div></div>`;
$('tab-edit').innerHTML=`<div class="bg-[#040814] border border-white/10 rounded-2xl p-3.5 space-y-3"><div class="text-xs font-black text-white border-b border-white/10 pb-2">مشخصات کلی تقابل</div><div class="grid grid-cols-2 gap-2.5">${ED_META.map(fld).join('')}</div></div>${tCard('تیم اول (راست / میزبان)','ed-hc',teamFlds('h','home'))}<div class="bg-[#040814] border border-white/10 rounded-2xl p-3.5"><div class="fbw gap-3"><label class="text-xs font-extrabold text-slate-200">تعداد تساوی‌های کل تاریخچه</label><input id="ed-dr" class="inp fm w-24 text-center" type="number" min="0"></div></div>${tCard('تیم دوم (چپ / رقیب)','ed-ac',teamFlds('a','away'))}<div class="bg-[#040814] border border-white/10 rounded-2xl p-3.5 space-y-2.5"><div class="text-xs font-black text-amber-300 border-b border-white/10 pb-2">جمع‌بندی تحریریه XGPedia (ماژول DNA)</div>${fld(['ed-dt','تیتر تحلیلی','dna.headline','text'])}${fld(['ed-db','متن حکم تحریریه','dna.body','area'])}</div>`;
ED_ALL.forEach(([id,,path,tp])=>{const el=$(id);if(el)el.oninput=e=>{const v=e.target.value;setP(S.m,path,tp==='num'?Math.max(0,parseInt(v,10)||0):tp==='code'?v.toUpperCase():v);draw()}});
}
const syncEditor=()=>ED_ALL.forEach(([id,,path])=>{const el=$(id);if(el)el.value=getP(S.m,path)??''});

// 2x PNG export via html-to-image
async function exportPNG(){
if(typeof htmlToImage==='undefined')return T('کتابخانه خروجی تصویر در دسترس نیست — لطفاً اتصال اینترنت را بررسی کنید');
const bd=$('ea'),sz=$('sz'),pt=bd.style.transform,ps=sz.classList.contains('hidden'),[w,h]=F[S.fmt];
T('در حال رندر تصویر PNG با کیفیت ۲ برابر (2×)...');
try{
sz.classList.add('hidden');bd.style.transform='none';
const url=await htmlToImage.toPng(bd,{width:w,height:h,pixelRatio:2,backgroundColor:'#0D1730',cacheBust:true});
const a=document.createElement('a');a.download=`XGPedia-H2H-${S.m.home.code}-${S.m.away.code}-${S.fmt.replace(':','x')}.png`;a.href=url;a.click();
T('تصویر باکیفیت PNG با موفقیت ذخیره شد');
}catch(err){console.error('PNG Export Error:',err);T('خطا در ذخیره تصویر (ممکن است لوگوی خارجی محدودیت CORS داشته باشد)')}
finally{bd.style.transform=pt;if(!ps)sz.classList.remove('hidden')}
}

// Populate sidebar buttons & wire events
$('slb').innerHTML=SU.map(([id,l,tg])=>`<button data-s="${id}" class="sb w-full min-h-[44px] lg:min-h-[40px] text-right px-3.5 py-2 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 text-slate-200 text-xs font-bold fbw gap-2 transition"><span>${l}</span><span class="text-[10px] fm ${id==='slide1'?'px-2 py-0.5 rounded bg-[#E62E45] text-white':id==='slide5'?'px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-400/40':id==='custom'?'text-amber-400':'text-slate-400'} shrink-0">${tg}</span></button>`).join('');
$('qsb').innerHTML=SU.filter(x=>x[3]).map(([id,,,sh])=>`<button data-q="${id}" class="qb min-h-[34px] px-3 rounded-xl text-xs font-bold bg-white/5 hover:bg-white/10 text-slate-300 border border-white/10 shrink-0 transition">${sh}</button>`).join('');
$('prb').innerHTML=Object.entries(PRESETS).map(([k,p])=>`<button data-p="${k}" class="pb min-h-[54px] p-2.5 rounded-xl bg-white/5 hover:bg-white/10 active:scale-[0.98] border border-white/10 text-right text-xs font-bold transition">${p.home.name} × ${p.away.name}<span class="block text-[10px] text-slate-400 font-normal mt-0.5">${p.competition} • ${fa(p.home.wins+p.draws+p.away.wins)} تقابل</span></button>`).join('');

on('.stab',e=>{S.tab=e.dataset.tab;$$('.stab').forEach(x=>x.classList.toggle('on',x.dataset.tab===S.tab));$('tab-slides').classList.toggle('hidden',S.tab!=='slides');$('tab-edit').classList.toggle('hidden',S.tab!=='edit');if(S.tab==='edit')syncEditor()});
on('.mnb',e=>mob(e.dataset.n));$('jp').onclick=()=>mob('preview');
on('.fb',e=>{S.fmt=e.dataset.f;S.zm=1;$$('.fb').forEach(x=>x.classList.toggle('on',x.dataset.f===S.fmt));S.sp==='custom'?draw():setSlide(S.sp)});
on('.sb',e=>setSlide(e.dataset.s));on('.qb',e=>setSlide(e.dataset.q));
on('.hb',e=>{S.hm=e.dataset.h;S.sp='custom';hl();draw()});
on('.ab',e=>{S.atm=e.dataset.a;hl();draw();T(`اتمسفر نوری تغییر کرد: ${e.textContent}`)});
$('ts').onclick=()=>{S.sz=!S.sz;draw();T(S.sz?'راهنمای امن استوری فعال شد':'راهنمای امن استوری مخفی شد')};
on('.zb',e=>zoom(e.dataset.z));$('zi').onclick=()=>zoom(S.zm+.25);$('zo').onclick=()=>zoom(S.zm-.25);
on('.pb',e=>{S.m=structuredClone(PRESETS[e.dataset.p]);syncEditor();modUI();draw();T(`آرشیو تقابل ${S.m.home.name} × ${S.m.away.name} بارگذاری شد`)});
$('cj').onclick=()=>{const t=document.createElement('textarea');t.value=JSON.stringify(S.m,null,2);t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();T('دیتای JSON با موفقیت کپی شد')};
$('exp-png').onclick=exportPNG;

const vp=$('vp');let dn=0,sx=0,sy=0,sl=0,st=0;
vp.onmousedown=e=>{if(S.zm<=1.01)return;dn=1;sx=e.pageX-vp.offsetLeft;sy=e.pageY-vp.offsetTop;sl=vp.scrollLeft;st=vp.scrollTop};
addEventListener('mouseup',()=>dn=0);
vp.onmousemove=e=>{if(!dn)return;e.preventDefault();vp.scrollLeft=sl-(e.pageX-vp.offsetLeft-sx);vp.scrollTop=st-(e.pageY-vp.offsetTop-sy)};
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fit).observe(vp);
addEventListener('resize',()=>{mob(S.mv);fit()});

buildEditor();syncEditor();setSlide('slide1');mob('preview');
})();
</script>
</body>
</html>
