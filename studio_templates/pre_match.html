}

function draw(){
const m=S.m,[w,h,lb]=F[S.fmt],bd=$('ea'),by=$('cmb'),hr=$('hs'),gd=$('mg');
const ac=S.mods.filter(x=>x.e),crw=dens(ac.length),b2=S.fmt==='16:9',dt=S.sp==='slide5',s9=S.fmt==='9:16';
bd.style.width=`${w}px`;bd.style.height=`${h}px`;
$('fs').setAttribute('viewBox',`0 0 ${w} ${h}`);
bd.className=`f${S.fmt.split(':')[0]}${crw?' dc':''}${dt?' dv':''}`;

const sb=$('ts');
$('sz').classList.toggle('hidden',!(s9&&S.sz));
sb.classList.toggle('hidden',!s9);sb.classList.toggle('flex',s9);sb.classList.toggle('on',s9&&S.sz);

const rx=w-147,rx1=w-24,rx2=w-44,by1=h-24,by2=h-44;
const sa=(i,o)=>{const e=$(i);for(const k in o)e.setAttribute(k,o[k])};
sa('pr',{width:w-24,height:h-24});
sa('hl',{x1:w/2,x2:w/2,y2:h-12});
sa('rb',{x:rx});sa('ra',{d:`M${rx} 245A95 95 0 0 0 ${rx} 405`});
sa('crh',{d:`M24 44V24H44M${rx1} 44V24H${rx2}M24 ${by2}V${by1}H44M${rx1} ${by2}V${by1}H${rx2}`});

const dm=`${w}×${h}`,up=(v,d)=>(v||d).trim().toUpperCase();
const tx={adb:dm,mdb:dm,mt:`${m.home.name} × ${m.away.name}`,mm:`${fa(m.probHome)}٪ / ${fa(m.probDraw)}٪ / ${fa(m.probAway)}٪ • ${lb}`,cc:m.competition,cr:fa(m.round),cd:`${fa(m.day)} • ${fa(m.time)}`,cs:m.stadium,cb:m.broadcast,so:m.source,ct:`${[up(m.leagueEn,'PREMIER LEAGUE'),up(m.season,'26/27'),up(m.weekCode,'W9')].filter(Boolean).join(' ')} • PRE-MATCH`};
for(const k in tx)$(k).textContent=tx[k];

const gp=b2?'':s9?(dt?'gap-2.5':'gap-3'):dt?'gap-2':crw?'gap-2.5':'gap-3';
by.className=`relative z-10 flex-1 py-2 overflow-hidden ${b2?'px-[44px] grid grid-cols-12 gap-8 items-stretch':`px-[36px] fcol justify-between ${gp}`}`;
hr.className=b2?'col-span-5 fcol justify-center border-l border-white/12 pl-7':'shrink-0';
gd.className=b2?'col-span-7 grid grid-cols-2 auto-rows-min gap-3 content-start min-h-0':`flex-1 grid grid-cols-2 ${dt?'auto-rows-min content-start':'auto-rows-fr'} ${s9?'gap-3':`${gp} overflow-hidden`} min-h-0`;

$('ag').style.background=`radial-gradient(circle at 86% 32%,${m.home.color}38,transparent 48%),radial-gradient(circle at 14% 32%,${m.away.color}38,transparent 48%),radial-gradient(circle at 50% 36%,#e62e4524,transparent 52%)`;
hr.innerHTML=heroH();gd.innerHTML=ac.map(x=>modH(x,b2)).join('');
fit();
}

function fit(){
const vp=$('vp'),wr=$('aw'),bd=$('ea'),[w,h]=F[S.fmt];
if(!vp||!vp.clientWidth||!vp.clientHeight)return;
const dk=innerWidth>=1024,sc=Math.min(Math.max(200,vp.clientWidth-(dk?48:22))/w,Math.max(200,vp.clientHeight-(dk?76:138))/h,1)*S.zm;
wr.style.width=`${Math.round(w*sc)}px`;wr.style.height=`${Math.round(h*sc)}px`;
bd.style.transform=`scale(${sc})`;vp.classList.toggle('cp',S.zm>1.01);
$$('.zb').forEach(b=>b.classList.toggle('on',Math.abs(S.zm-+b.dataset.z)<.05));
}

const zoom=z=>{S.zm=Math.max(.75,Math.min(2.5,+z));fit();if(S.zm<=1){const v=$('vp');v.scrollLeft=v.scrollTop=0}};

function mob(v){
S.mv=v;const dk=innerWidth>=1024,sh=(e,ok)=>{e.classList.toggle('hidden',!ok);e.classList.toggle('flex',ok)};
if(!dk){sh($('sp'),v!=='preview');sh($('sc'),v==='preview');v==='preview'?requestAnimationFrame(fit):($('es').scrollTop=0)}
else{sh($('sp'),1);sh($('sc'),1);requestAnimationFrame(fit)}
$$('.mnb').forEach(b=>b.classList.toggle('on',b.dataset.n===v));
}

function modUI(){
const host=$('mcl');
host.innerHTML=S.mods.map((m,i)=>{
const[,t,h]=MD[i];
return`<div class="fbw gap-2 p-3 lg:p-2.5 min-h-[48px] lg:min-h-[40px] rounded-xl bg-[#091124] border ${m.e?'border-white/20':'border-white/5 opacity-65'} transition"><label class="fi gap-2.5 min-w-0 flex-1 cursor-pointer"><input type="checkbox" data-m="${m.id}" ${m.e?'checked':''} class="mc accent-[#E62E45] w-5 h-5 lg:w-4 lg:h-4 cursor-pointer shrink-0"><span class="text-sm lg:text-xs font-bold text-slate-100 truncate">${t}</span></label>${h?`<div class="fi bg-[#040814] rounded-lg p-0.5 border border-white/10 shrink-0"><button data-m="${m.id}" data-w="half" class="spn px-2 py-1 rounded text-[11px] lg:text-[10px] font-bold ${m.s==='half'?'bg-[#E62E45] text-white':'text-slate-400'}">نیم‌عرض ½</button><button data-m="${m.id}" data-w="full" class="spn px-2 py-1 rounded text-[11px] lg:text-[10px] font-bold ${m.s==='full'?'bg-[#E62E45] text-white':'text-slate-400'}">تمام‌عرض ۱</button></div>`:'<span class="text-[11px] lg:text-[10px] text-slate-500 px-1.5 shrink-0">تمام‌عرض</span>'}</div>`;
}).join('');
host.querySelectorAll('.mc').forEach(c=>c.onchange=()=>{
const t=S.mods.find(x=>x.id===c.dataset.m);
if(!c.checked&&S.mods.filter(x=>x.e).length<=1){c.checked=true;return T('حداقل یک ماژول باید فعال بماند')}
t.e=c.checked;S.sp='custom';hl();modUI();draw();
});
host.querySelectorAll('.spn').forEach(b=>b.onclick=()=>{
const t=S.mods.find(x=>x.id===b.dataset.m);if(!t)return;
t.s=b.dataset.w;t.e=true;S.sp='custom';hl();modUI();draw();
});
}

$('slb').innerHTML=SU.map(([id,l,tg])=>`<button data-s="${id}" class="sb w-full min-h-[50px] lg:min-h-[44px] text-right px-3.5 py-2.5 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 text-slate-200 text-sm lg:text-xs font-bold fbw gap-2 transition"><span>${l}</span><span class="text-[11px] lg:text-[10px] fm ${id==='slide1'?'px-2 py-0.5 rounded bg-[#E62E45] text-white':id==='custom'?'text-amber-400':'text-slate-400'} shrink-0">${tg}</span></button>`).join('');
$('qsb').innerHTML=SU.filter(x=>x[3]).map(([id,,,sh])=>`<button data-q="${id}" class="qb min-h-[34px] px-3 rounded-xl text-xs font-bold bg-white/5 hover:bg-white/10 text-slate-300 border border-white/10 shrink-0 transition">${sh}</button>`).join('');
$('prb').innerHTML=Object.entries(PRESETS).map(([k,p])=>`<button data-p="${k}" class="pb min-h-[58px] p-3 rounded-xl bg-white/5 hover:bg-white/10 active:scale-[0.98] border border-white/10 text-right text-sm lg:text-xs font-bold transition">${p.home.name} × ${p.away.name}<span class="block text-xs lg:text-[10px] text-slate-400 font-normal mt-0.5">${p.competition} • ${p.weekCode}</span></button>`).join('');

on('.mnb',e=>mob(e.dataset.n));
$('jp').onclick=()=>mob('preview');
on('.fb',e=>{S.fmt=e.dataset.f;S.zm=1;$$('.fb').forEach(x=>x.classList.toggle('on',x.dataset.f===S.fmt));S.sp==='slide1'||S.sp==='slide5'?setSlide(S.sp):draw()});
on('.sb',e=>setSlide(e.dataset.s));
on('.qb',e=>setSlide(e.dataset.q));
on('.hb',e=>{S.hm=e.dataset.h;S.sp='custom';hl();draw()});
$('ts').onclick=()=>{S.sz=!S.sz;draw();T(S.sz?'راهنمای امن استوری فعال شد':'راهنمای امن استوری مخفی شد')};
on('.zb',e=>zoom(e.dataset.z));
$('zi').onclick=()=>zoom(S.zm+.25);
$('zo').onclick=()=>zoom(S.zm-.25);
on('.pb',e=>{S.m=structuredClone(PRESETS[e.dataset.p]);modUI();draw();T(`مسابقه ${S.m.home.name} × ${S.m.away.name} بارگذاری شد`)});
$('cj').onclick=()=>{const t=document.createElement('textarea');t.value=JSON.stringify(S.m,null,2);t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();T('دیتای JSON کپی شد')};

const vp=$('vp');let dn=0,sx=0,sy=0,sl=0,st=0;
vp.onmousedown=e=>{if(S.zm<=1.01)return;dn=1;sx=e.pageX-vp.offsetLeft;sy=e.pageY-vp.offsetTop;sl=vp.scrollLeft;st=vp.scrollTop};
addEventListener('mouseup',()=>dn=0);
vp.onmousemove=e=>{if(!dn)return;e.preventDefault();vp.scrollLeft=sl-(e.pageX-vp.offsetLeft-sx);vp.scrollTop=st-(e.pageY-vp.offsetTop-sy)};
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fit).observe(vp);
addEventListener('resize',()=>{mob(S.mv);fit()});

setSlide('slide1');mob('preview');
})();
</script>
</body>
</html>
