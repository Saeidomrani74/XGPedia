name: xgpedia-pr-ci

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, "feat/**", "fix/**"]

permissions:
  contents: read

concurrency:
  group: xgpedia-pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and Chromium
        run: pip install -e ".[render,publish,scrape,dev]" && python -m playwright install --with-deps chromium
      - name: Ruff static safety gate (undefined names & loop closures)
        run: ruff check src/ run.py --select E9,F63,F7,F82,F811,B023
      - name: Run full offline pytest suite
        run: python -m pytest tests/ -q
      - name: Visual QA Regression Gate (4:5, 9:16, 16:9, JPEG & SAMPLE)
        run: python run.py visual-qa
