name: xgpedia-jobs

on:
  schedule:
    - cron: "30 5 * * *"   # daily_fixtures — ساعت ۰۹:۰۰ تهران (۰۵:۳۰ UTC)
    - cron: "0 20 * * *"   # pre_match window — ۶ تا ۱۲ ساعت قبل از کیک‌آف‌های شبانه
  workflow_dispatch: {}    # اجرای دستی از UI

permissions:
  contents: read

concurrency:
  group: xgpedia-jobs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[render,publish,scrape,dev]" && python -m playwright install --with-deps chromium
      - name: Static syntax, undefined-name & loop-closure gate (Ruff)
        run: ruff check src/ run.py --select E9,F63,F7,F82,F811,B023
      - run: python run.py init
        env:
          DATABASE_PATH: data/dev.sqlite
      # نتایج + xG — بدون کلید (football-data.co.uk)؛ همیشه اجرا می‌شود
      - run: python run.py sync-results
        env:
          DATABASE_PATH: data/dev.sqlite
      # بازی‌های پیش‌رو — فقط وقتی secret تنظیم شده باشد.
      - name: Sync upcoming fixtures (when token is configured)
        run: |
          if [ -n "$FOOTBALL_DATA_ORG_TOKEN" ]; then
            python run.py fixtures --days 7
          else
            echo "FOOTBALL_DATA_ORG_TOKEN not set; skipping fixtures sync."
          fi
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          DATABASE_PATH: data/dev.sqlite
      # تازگی داده بعد از sync — با FAIL کار را می‌شکند اگر چیزی خراب باشد
      - run: python run.py status
        env:
          DATABASE_PATH: data/dev.sqlite
      # مجموعهٔ تست کامل در محیط تمیز (CI — دیتابیس SQLite روی runner موقتی است و جایگزین زمان‌بند دائمی نیست)
      - run: python -m pytest tests/ -q
        env:
          DATABASE_PATH: data/dev.sqlite
      # آزمون رگرسیون بصری خودکار روی Chromium
      - name: Visual QA Regression Gate
        run: python run.py visual-qa
      # نکته: cron گیت‌هاب چند دقیقه تأخیر طبیعی دارد — برای لایو و ربات
      # همیشه‌روشن مناسب نیست؛ VPS فقط پس از نیاز واقعی (دروازهٔ ۴)
